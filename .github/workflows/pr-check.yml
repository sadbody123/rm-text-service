name: PR 规范检查

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-check:
    name: PR 规范检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 检查 PR 描述
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/check_pr_body.py

      - name: 检查 commit 数量
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export LC_ALL=C.UTF-8
          export LANG=C.UTF-8
          count=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/commits?per_page=100" --jq 'length')
          echo "PR 包含 ${count} 个 commit。"
          if [ "${count}" -gt 30 ]; then
            echo "::error::PR 包含 ${count} 个 commit，超过上限 30 个。请拆分 PR 或整理提交历史。"
            exit 1
          fi
